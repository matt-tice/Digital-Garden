name: Compile and Deploy Digital Garden

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2        # Captures the current push and its parent commit

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox pandoc

      - name: Compute Changes and Run Make
        run: |
          # Make sure the output directory exists, even if no org files were modified (in case the makefile, yaml file, etc. are modified)
          mkdir -p public-export
          # 1. Extract only the modified .org files from the commit diff
          CHANGED_ORG=$(git diff --name-only HEAD^1 HEAD | grep '^notes/.*\.org$' || true)

          # 2. Check if there is actual work to do
          if [ -z "$CHANGED_ORG" ]; then
            echo "No .org files modified in this push. Skipping compilation."
            exit 0
          fi

          echo "Modified source files detected:"
          echo "$CHANGED_ORG"

          # 3. Transform the .org source paths into the expected .md target paths
          # Example: notes/engineering/vector.org -> public-export/engineering/vector.md
          MAKE_TARGETS=""
          TOUCHED_DIRS=""

          for file in $CHANGED_ORG; do
            if [ -f "$file" ]; then # checks that file wasn't deleted
              REL_PATH=${file#notes/} # remove the notes/ header from the file paths
              DIR_NAME=$(dirname "$REL_PATH") # extract parent directory
              TARGET_HTML="public-export/${REL_PATH%.org}.html" # remove the .org suffix from the paths
              MAKE_TARGETS="$MAKE_TARGETS $TARGET_HTML"
              if [ "$DIR_NAME" != "." ]; then
                TARGET_INDEX="public-export/$DIR_NAME/index.html"
                # Add to a temporary list to deduplicate later
                TOUCHED_DIRS="$TOUCHED_DIRS $TARGET_INDEX"
              fi
            fi
          done

          # 4. Deduplicate the directory indices so we don't build the same index twice
          DEDUPLICATED_INDEXES=$(echo "$TOUCHED_DIRS" | tr ' ' '\n' | sort -u | tr '\n' ' ')

          # 5. Merge the specific notes and the specific indexes into one command execution
          FINAL_TARGETS="$MAKE_TARGETS $DEDUPLICATED_INDEXES"

          # 6. Invoke the Makefile, explicitly overriding the target variable
          echo "Executing toolchain for targets: $MAKE_TARGETS"
          # make $FINAL_TARGETS
          make all
          
      - name: Deploy Compiled Artifacts to Github Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-export
          publish_branch: gh-pages
          keep_files: true      # otherwise this action would delete all of the unchanged files
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
