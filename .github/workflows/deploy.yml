name: Compile and Deploy Digital Garden

on:
  push:
    branches:
      - main                    # Trigger only when you push to main


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest      # Github's cloud OS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run the Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox pandoc

      - name: Execute Local Compilation Toolchain
        run: |
          make                  # Runs the GNU Makefile
